<!doctype html>
<html lang='en'>
  <head>
    <meta charset='UTF-8'>
    <title>Events</title>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <script src='https://cdn.tailwindcss.com?plugins=typography'></script>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        /* Fallback for very old browsers */
        background-image: url('/assets/background.png');
        /* Prefer WebP where supported with graceful step-down to PNG */
        background-image: -webkit-image-set(
          url('/assets/background.webp') 1x,
          url('/assets/background.png') 1x
        );
        background-image: image-set(
          url('/assets/background.webp') 1x,
          url('/assets/background.png') 1x
        );
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body class='text-gray-800 font-sans leading-relaxed'>
    <header class='bg-gradient-to-r from-amber-50/90 to-stone-100/80 shadow-lg py-4 px-6 mb-8'>
      <div class='max-w-7xl mx-auto flex items-center justify-between'>
        <div class='flex items-center gap-3'>
          <picture>
            <source srcset='/assets/JeffOdellSolo.webp' type='image/webp'>
            <img
              src='/assets/JeffOdellSolo.png'
              alt='Jeff Odell Solo logo'
              class='h-12 w-auto object-contain shrink-0'
              loading='eager'
              decoding='async'
            >
          </picture>
          <h1 class='text-2xl sm:text-3xl leading-tight font-extrabold tracking-tight text-amber-800 sm:text-transparent sm:bg-clip-text sm:bg-[linear-gradient(90deg,theme(colors.amber.700)_0%,theme(colors.amber.600)_33%,theme(colors.amber.500)_66%,theme(colors.stone.600)_100%)] drop-shadow-sm'>
            Events
          </h1>
        </div>
        <nav class='flex gap-4'>
          
            <a
              href='/'
              class='bg-amber-700/10 hover:bg-amber-700/20 backdrop-blur-sm text-amber-800 font-semibold px-4 py-2 rounded-lg transition-all duration-200 hover:scale-105 shadow-md border border-amber-200'
            >
              Home
            </a>
          
          
          
            <a
              href='/media/'
              class='bg-amber-700/10 hover:bg-amber-700/20 backdrop-blur-sm text-amber-800 font-semibold px-4 py-2 rounded-lg transition-all duration-200 hover:scale-105 shadow-md border border-amber-200'
            >
              Media
            </a>
          
          
            <a
              href='/posts/'
              class='bg-amber-700/10 hover:bg-amber-700/20 backdrop-blur-sm text-amber-800 font-semibold px-4 py-2 rounded-lg transition-all duration-200 hover:scale-105 shadow-md border border-amber-200'
            >
              Blog
            </a>
          
        </nav>
      </div>
    </header>

    <main class='w-full px-4 flex-grow'>
      <article class='bg-white/90 backdrop-blur-sm rounded-lg p-6 shadow-lg'>
        <div class='sk-fb-event' data-embed-id='25622128'></div>
<script
  src='https://widgets.sociablekit.com/facebook-page-events/widget.js'
  defer
></script>

      </article>
    </main>

    <footer class='mt-12 text-sm text-center text-gray-500 py-6 bg-white/80 backdrop-blur-sm'>
      &copy;  Jeff Odell. All rights reserved.
    </footer>
  </body>
</html>
